name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"

      - name: Cek tag cocok versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          nama=$(sed -n 's/^[[:space:]]*versionName "\(.*\)"/\1/p' app/build.gradle | head -1)
          echo "tag=$tag versionName=$nama"
          if [ "$tag" != "$nama" ]; then
            echo "GAGAL: tag v$tag tidak cocok dengan versionName $nama"; exit 1
          fi

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.p12
          fi

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: ${{ (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ (startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && secrets.KEY_PASSWORD || '' }}
        run: |
          set +e
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee /tmp/build.log
          s=${PIPESTATUS[0]}
          if [ "$s" -ne 0 ] && grep -Eqi 'could not (resolve|get|download)|connection (reset|timed out)|read timed out|temporary failure|unable to access' /tmp/build.log; then
            echo "Kegagalan jaringan terdeteksi, mencoba sekali lagi"
            sleep 30
            ./gradlew assembleDebug assembleRelease --stacktrace && s=0
          fi
          exit "$s"

      - name: Rename APKs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            SUFFIX="-${GITHUB_REF_NAME}"
          else
            SUFFIX=""
          fi
          mkdir -p apks
          cp app/build/outputs/apk/debug/app-debug.apk "apks/disc-server${SUFFIX}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "apks/disc-server${SUFFIX}-release.apk"
          ls -la apks

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: apks/

      - name: Terbitkan GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apks/disc-server-*-release.apk
          generate_release_notes: true
